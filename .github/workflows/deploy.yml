# Run the tests that can run without the crawled catalogue on every push to main.
#
# Web.Tests is deliberately not run here: it needs data/courseplanner.db, which
# is 58 MB of crawled data and rightly not in git, and its fixture throws rather
# than skips when the file is absent. Run it locally before pushing.
# ScraperTests builds its own synthetic database, so it runs anywhere.

name: test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test the ingest and query logic
        run: dotnet test ScraperTests -c Release
